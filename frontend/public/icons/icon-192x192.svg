<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle inner ambient glow -->
  <circle cx="96" cy="96" r="60" fill="#10b981" opacity="0.12" filter="blur(16px)" />
  
  <!-- UdyamAI Emblem -->
  <g transform="translate(96, 96)">
    <!-- Outer Growth Ring -->
    <path d="M -48,-12 C -48,-42 -22,-62 0,-62 C 22,-62 48,-42 48,-12 C 48,22 22,56 0,62 C -22,56 -48,22 -48,-12 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Rising Sun / AI Spark -->
    <circle cx="0" cy="-6" r="14" fill="url(#accentGlow)" />
    
    <!-- Sprouting Leaf / Rupee symbol dynamic curve -->
    <path d="M -18,18 Q 0,0 24,-14 Q 8,14 -12,30 Z" fill="url(#primaryGlow)" />
    
    <!-- Base Foundation Nodes -->
    <circle cx="-28" cy="22" r="4" fill="#34d399" />
    <circle cx="28" cy="22" r="4" fill="#34d399" />
    <circle cx="0" cy="42" r="5" fill="#f59e0b" />
  </g>
</svg>
