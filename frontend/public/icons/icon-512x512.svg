<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGlow512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Subtle inner ambient glow -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.15" filter="blur(32px)" />
  
  <!-- UdyamAI Emblem -->
  <g transform="translate(256, 256) scale(2.65)">
    <!-- Outer Growth Ring -->
    <path d="M -48,-12 C -48,-42 -22,-62 0,-62 C 22,-62 48,-42 48,-12 C 48,22 22,56 0,62 C -22,56 -48,22 -48,-12 Z" fill="none" stroke="url(#primaryGlow512)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Rising Sun / AI Spark -->
    <circle cx="0" cy="-6" r="14" fill="url(#accentGlow512)" />
    
    <!-- Sprouting Leaf / Rupee symbol dynamic curve -->
    <path d="M -18,18 Q 0,0 24,-14 Q 8,14 -12,30 Z" fill="url(#primaryGlow512)" />
    
    <!-- Base Foundation Nodes -->
    <circle cx="-28" cy="22" r="4" fill="#34d399" />
    <circle cx="28" cy="22" r="4" fill="#34d399" />
    <circle cx="0" cy="42" r="5" fill="#f59e0b" />
  </g>
</svg>
